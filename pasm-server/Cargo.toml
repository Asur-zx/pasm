[package]
name = "pasm-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pasm_server"
path = "src/main.rs"

[dependencies]
pasm-core = { path = "../pasm-core", features = ["server", "native"] }
axum = { version = "0.8.8", features = ["tokio", "http1"] }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
dotenv = "0.15.0"
async-trait = "0.1"
http = "1.0"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4"] }
