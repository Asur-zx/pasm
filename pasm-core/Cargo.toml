[package]
name = "pasm-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
server = ["dep:axum"]
native = ["dep:toml"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
magic-crypt = "3.1.6"
sha2 = "0.9.9"
argon2 = "0.5"
http = "1.0"
axum = { version = "0.8.8", optional = true }
toml = { version = "0.8", optional = true }
