[package]
name = "pasm-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pasm_client"
path = "src/main.rs"

[dependencies]
pasm-core = { path = "../pasm-core", features = ["native"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
magic-crypt = "3.1.6"
sha2 = "0.9.9"
colored = "2.0"
